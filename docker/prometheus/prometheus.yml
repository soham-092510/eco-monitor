global:

  # Scrape every 10 seconds.
  #
  # SRS requirement:
  # scrape interval must not exceed 15 seconds.
  scrape_interval: 10s

# SCRAPE TARGETS

scrape_configs:


  # -------------------------------------------------------
  # Auth Service Metrics
  - job_name: "auth-service"

    static_configs:

      - targets:
          - "auth-service:8000"


  # -------------------------------------------------------
  # Payment Service Metrics
  - job_name: "payment-service"

    static_configs:

      - targets:
          - "payment-service:8000"


  # -------------------------------------------------------
  # Kepler Energy Metrics


  - job_name: "kepler"

    static_configs:

      - targets:
          - "kepler:9103"